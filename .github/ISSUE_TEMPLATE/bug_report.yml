name: Bug report
description: Something buildlock does wrong
body:
    -   type: textarea
        id: what
        attributes:
            label: What happened, and what you expected
        validations:
            required: true
    -   type: textarea
        id: repro
        attributes:
            label: How to reproduce it
            placeholder: The command you ran, and anything else running at the time.
    -   type: textarea
        id: doctor
        attributes:
            label: Output of `buildlock doctor`
            render: text
        validations:
            required: true
    -   type: textarea
        id: status
        attributes:
            label: Output of `buildlock status --json` while it happens (if it is about waiting)
            render: json
