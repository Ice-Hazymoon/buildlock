name: Release

on:
    push:
        tags: ['v*']

permissions:
    contents: read

jobs:
    check:
        name: Check
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false
            -   uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
                with:
                    bun-version: 1.4.4
            -   uses: ./.github/actions/shellcheck
            -   name: The tag matches the script's version and the changelog
                run: |
                    version="$(sed -n 's/^bl_version=//p' bin/buildlock)"
                    test "v$version" = "$GITHUB_REF_NAME" || { echo "bin/buildlock says $version, the tag is $GITHUB_REF_NAME"; exit 1; }
                    grep -qx "## $version" CHANGELOG.md || { echo "CHANGELOG.md has no '## $version' heading"; exit 1; }
                    package="$(node -p 'require("./package.json").version')"
                    test "$package" = "$version" || { echo "package.json says $package, the tag is $GITHUB_REF_NAME"; exit 1; }
            -   run: shellcheck bin/buildlock install.sh scripts/release.sh
            -   run: bun test

    publish:
        name: Publish
        needs: check
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false
            -   name: Assets
                run: |
                    mkdir dist
                    cp bin/buildlock install.sh dist/
                    (cd dist && sha256sum buildlock > buildlock.sha256 && sha256sum install.sh > install.sh.sha256)
            -   uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
                with:
                    subject-path: 'dist/buildlock, dist/install.sh'
            -   name: Release notes from CHANGELOG.md
                run: |
                    version="${GITHUB_REF_NAME#v}"
                    awk -v v="## $version" '$0 == v { on = 1; next } /^## / && on { exit } on' CHANGELOG.md > notes.md
                    test -s notes.md || { echo "no notes for $version in CHANGELOG.md"; exit 1; }
            -   name: Publish
                env:
                    GH_TOKEN: ${{ github.token }}
                run: |
                    prerelease=()
                    [[ "$GITHUB_REF_NAME" != *-* ]] || prerelease=(--prerelease)
                    gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "buildlock ${GITHUB_REF_NAME#v}" --notes-file notes.md "${prerelease[@]}"

    npm:
        name: Publish to npm
        needs: publish
        runs-on: ubuntu-latest
        permissions:
            contents: read
            # Trusted publishing: npm trades this job's OIDC token for a one-time
            # publish token and adds provenance. No npm token is stored anywhere.
            id-token: write
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false
            -   uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
                with:
                    node-version: 24
                    registry-url: https://registry.npmjs.org
            -   name: Publish
                run: |
                    set -euo pipefail
                    version="${GITHUB_REF_NAME#v}"
                    test "$(node -p 'require("./package.json").version')" = "$version"
                    # Trusted publishing needs npm 11.5.1 or newer.
                    IFS=. read -r major minor patch <<< "$(npm --version)"
                    (( major > 11 || (major == 11 && (minor > 5 || (minor == 5 && patch >= 1))) )) || npm install -g npm@^11.5.1
                    if npm view "buildlock@$version" version > /dev/null 2>&1; then
                        echo "buildlock@$version is already on npm"
                        exit 0
                    fi
                    tag=latest
                    [[ "$version" != *-* ]] || tag=next
                    npm publish --tag "$tag"
            -   name: Install it from npm, as users do
                run: |
                    set -euo pipefail
                    version="${GITHUB_REF_NAME#v}"
                    for attempt in 1 2 3 4 5 6; do
                        npm install -g --prefix "$RUNNER_TEMP/npm" "buildlock@$version" && break
                        sleep 10
                    done
                    test "$("$RUNNER_TEMP/npm/bin/buildlock" --version)" = "buildlock $version"
                    test "$("$RUNNER_TEMP/npm/bin/buildlock" bash -c 'echo ok')" = ok

    smoke:
        name: Install the release
        needs: publish
        runs-on: ubuntu-latest
        steps:
            -   name: The one-line installer, as users run it
                run: |
                    set -euo pipefail
                    sleep 10
                    curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/install.sh" \
                        | bash -s -- --version "$GITHUB_REF_NAME" --prefix "$RUNNER_TEMP/bin" --yes
                    test "$("$RUNNER_TEMP/bin/buildlock" --version)" = "buildlock ${GITHUB_REF_NAME#v}"
                    test "$("$RUNNER_TEMP/bin/buildlock" bash -c 'echo ok')" = ok
